name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run typecheck
      - run: npm test -w backend
      - run: npm test -w frontend
      - run: npm run build
  production-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real production Compose integration
        run: npm run test:production-compose
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client and MinIO client
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          for client in psql pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/$client" <<EOF
          #!/usr/bin/env bash
          exec docker run --rm --network host \
            --env PGPASSWORD="\${PGPASSWORD:-}" \
            -v "\${GITHUB_WORKSPACE}:\${GITHUB_WORKSPACE}" \
            -w "\${GITHUB_WORKSPACE}" \
            postgres:16-alpine $client "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/$client"
          done
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          mc_version="RELEASE.2025-08-13T08-35-41Z"
          mc_url="https://github.com/minio/mc/releases/download/${mc_version}/mc.linux-amd64.${mc_version}"
          mc_sha256="01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"
          curl --fail --silent --show-error --location \
            "https://github.com/minio/mc/releases/download/${mc_version}/mc.linux-amd64.${mc_version}" \
            --output mc
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  mc" | sha256sum --check
          chmod +x mc
          sudo install -m 0755 mc /usr/local/bin/mc
      - name: Start isolated drill services
        run: docker compose up -d db minio
      - name: Wait for services
        run: |
          until PGPASSWORD=securityops psql \
            "postgres://securityops:securityops@127.0.0.1:5432/securityops?sslmode=disable" \
            -v ON_ERROR_STOP=1 -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done
          until curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; do sleep 2; done
      - name: Apply schema
        env:
          PGPASSWORD: securityops
        run: |
          for migration in backend/migrations/*.sql; do
            psql \
              --host 127.0.0.1 \
              --username securityops \
              --dbname securityops \
              --set ON_ERROR_STOP=1 \
              --file "$migration"
          done
      - name: Create isolated restore database
        run: |
          PGPASSWORD=securityops psql \
            "postgres://securityops:securityops@127.0.0.1:5432/securityops?sslmode=disable" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE securityops_restore;"
      - name: Execute PostgreSQL and MinIO restore drill
        env:
          DATABASE_URL: postgres://securityops:securityops@127.0.0.1:5432/securityops?sslmode=disable
          RESTORE_DATABASE_URL: postgres://securityops:securityops@127.0.0.1:5432/securityops_restore?sslmode=disable
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: restore-drill
          MINIO_SECRET_KEY: restore-drill-secret
          MINIO_BUCKET: securityops-dms-restore-drill
          RESTORE_DRILL_ALLOW_ISOLATED_RESOURCES: YES
          RESTORE_DRILL_WORK_DIRECTORY: ${{ github.workspace }}/.restore-drill
        run: ./scripts/restore-drill.sh
      - name: Tear down isolated drill services
        if: always()
        run: docker compose down -v
  browser-e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://securityops:securityops@127.0.0.1:5432/securityops
      E2E_API_BASE_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:5173
      E2E_FIXTURE: isolated
      E2E_TENANT_NAME: e2e-phase-4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Generate isolated fixture credentials
        run: |
          echo "E2E_EMAIL=e2e-${GITHUB_RUN_ID}@example.invalid" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start isolated backend and dependencies
        run: docker compose up -d --build backend frontend
      - name: Wait for backend and schema
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color backend db minio
          exit 1
      - name: Create isolated browser fixture
        run: npm run e2e:fixture
      - name: Wait for frontend
        run: |
          until curl --fail --silent http://127.0.0.1:5173/login >/dev/null; do sleep 2; done
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser E2E
        run: npm run e2e
      - name: Upload real-run browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-browser-e2e-${{ github.run_id }}
          path: e2e-results/
          if-no-files-found: warn
      - name: Tear down isolated browser stack
        if: always()
        run: docker compose down -v
