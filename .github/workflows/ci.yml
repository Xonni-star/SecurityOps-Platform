name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run typecheck
      - run: npm test -w backend
      - run: npm test -w frontend
      - run: npm run build
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client and MinIO client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          mc_version="RELEASE.2025-08-13T08-35-41Z"
          mc_url="https://github.com/minio/mc/releases/download/${mc_version}/mc.linux-amd64.${mc_version}"
          mc_sha256="01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"
          curl --fail --silent --show-error --location \
            "$mc_url" \
            --output mc
          printf '%s  %s\n' "$mc_sha256" mc | sha256sum --check --status
          chmod +x mc
          sudo install -m 0755 mc /usr/local/bin/mc
      - name: Start isolated drill services
        run: docker compose up -d db minio
      - name: Wait for services
        run: |
          until docker compose exec -T db pg_isready -U securityops -d securityops; do sleep 2; done
          until curl --fail --silent http://127.0.0.1:9000/_localstack/health >/dev/null; do sleep 2; done
      - name: Apply schema
        run: docker compose run --rm backend node dist/migrate.js
      - name: Create isolated restore database
        env:
          PGPASSWORD: securityops
        run: createdb --host 127.0.0.1 --username securityops --maintenance-db securityops securityops_restore
      - name: Execute PostgreSQL and MinIO restore drill
        env:
          DATABASE_URL: postgres://securityops:securityops@127.0.0.1:5432/securityops
          RESTORE_DATABASE_URL: postgres://securityops:securityops@127.0.0.1:5432/securityops_restore
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: restore-drill
          MINIO_SECRET_KEY: restore-drill-secret
          MINIO_BUCKET: securityops-dms-restore-drill
          RESTORE_DRILL_ALLOW_ISOLATED_RESOURCES: YES
        run: ./scripts/restore-drill.sh
      - name: Tear down isolated drill services
        if: always()
        run: docker compose down -v
