services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-securityops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securityops}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DEV_SEED_ENABLED: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-notifications@securityops.local}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_HEALTH_URL: ${SMS_GATEWAY_HEALTH_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
      TIMESCAN_API_TOKEN: ${TIMESCAN_API_TOKEN:-}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres-data:
